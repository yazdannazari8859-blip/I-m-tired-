
name: Build VCClient

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle 2.14.1
        run: |
          wget https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Extract source
        run: |
          unzip -o VCClient-1.1-Navigation-Source-FIXED.zip -d source

      - name: Build VCClient
        working-directory: source/VCClient-1.1-Navigation-Source
        run: |
          ../..//../gradle-2.14.1/bin/gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VCClient-fixed
          path: source/VCClient-1.1-Navigation-Source/build/libs/*.jar
          if-no-files-found: error
          
