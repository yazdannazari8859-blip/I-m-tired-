
name: Build VCClient

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Find and extract source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' ! -name 'gradle-2.14.1-bin.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found in repository root"
            ls -la
            exit 1
          fi
          echo "Using $ZIP_FILE"
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Locate Gradle project
        id: project
        run: |
          BUILD_FILE=$(find source -name build.gradle -type f | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            find source -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build mod
        working-directory: .
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          "$GITHUB_WORKSPACE/gradle-2.14.1/bin/gradle" build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VCClient-fixed
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
